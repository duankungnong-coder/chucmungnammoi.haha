<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Năm Mới 2026</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Arial', sans-serif;
        }

        /* Lớp phủ yêu cầu click để phát nhạc */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 999;
            display: flex; justify-content: center; align-items: center;
            color: #ffd700; cursor: pointer; text-align: center;
        }

        .background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,29,61,0.7), rgba(0,53,102,0.7)),
                        url('https://images.unsplash.com/photo-1533230393124-35e1fa239328?auto=format&fit=crop&w=1350&q=80');
            background-size: cover; background-position: center; z-index: -1;
        }

        .content {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; width: 95%; z-index: 10; opacity: 0; transition: opacity 2s;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 4rem); color: #fff;
            text-shadow: 0 0 20px #ff0000, 0 0 30px #ffd700;
            margin: 0; text-transform: uppercase;
        }

        .year {
            font-size: clamp(4rem, 15vw, 8rem); font-weight: 900;
            background: linear-gradient(to bottom, #ffd700, #fff, #ffd700);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8)); margin: -10px 0;
        }

        .goal-item {
            font-size: clamp(1.2rem, 5vw, 2.5rem); font-weight: bold;
            color: #00ffcc; display: block; margin: 15px 0;
            background: rgba(255, 255, 255, 0.15); padding: 10px 20px;
            border-radius: 50px; border: 2px solid #ffd700; backdrop-filter: blur(5px);
        }

        .score-box {
            display: inline-block; color: #fff;
            background: linear-gradient(45deg, #ff0055, #ffcc00);
            padding: 10px 30px; border-radius: 20px;
            font-size: clamp(1.5rem, 6vw, 3rem); font-weight: 900;
            box-shadow: 0 0 25px #ffcc00; animation: bounce 1s infinite alternate;
        }

        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.05); } }

        canvas { display: block; }
    </style>
</head>
<body>

    <div id="overlay">
        <div>
            <h2 style="font-size: 2rem;">🏮 CHÀO 2026 🏮</h2>
            <p>Chạm vào màn hình để bắt đầu!</p>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-energy.mp3" type="audio/mpeg">
    </audio>

    <div class="background"></div>

    <div class="content" id="mainContent">
        <h1>Chúc Mừng Năm Mới</h1>
        <div class="year">2026</div>
        
        <div class="goals">
            <span class="goal-item">🎓 ĐỖ ĐẠI HỌC TOP 🎓</span>
            <div class="score-box">🚀 90 TSA & 120 HSA 🚀</div>
        </div>

        <div style="font-size: 1.5rem; color: #fff; margin-top: 20px; font-weight: bold;">
            🍀 May Mắn - Bình An - Hạnh Phúc 🍀
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const overlay = document.getElementById('overlay');
        const music = document.getElementById('bgMusic');
        const content = document.getElementById('mainContent');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Xử lý kích hoạt khi người dùng click
        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            content.style.opacity = '1';
            music.play(); // Phát nhạc
            animate(); // Bắt đầu pháo hoa
        });

        class Firework {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.sx = Math.random() * 4 - 2;
                this.sy = Math.random() * -4 - 5;
                this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                this.shouldExplode = false;
            }
            update() {
                this.x += this.sx; this.y += this.sy; this.sy += 0.05;
                if (this.sy >= -1) this.shouldExplode = true;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI * 2); ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.sx = Math.random() * 8 - 4; this.sy = Math.random() * 8 - 4;
                this.alpha = 1;
            }
            update() { this.x += this.sx; this.y += this.sy; this.alpha -= 0.015; }
            draw() {
                ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI * 2); ctx.fill();
            }
        }

        let fireworks = [];
        let particles = [];

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (Math.random() < 0.1) fireworks.push(new Firework());

            fireworks.forEach((fw, i) => {
                fw.update(); fw.draw();
                if (fw.shouldExplode) {
                    for (let j = 0; j < 60; j++) particles.push(new Particle(fw.x, fw.y, fw.color));
                    fireworks.splice(i, 1);
                }
            });

            particles.forEach((p, i) => {
                p.update(); p.draw();
                if (p.alpha <= 0) particles.splice(i, 1);
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
